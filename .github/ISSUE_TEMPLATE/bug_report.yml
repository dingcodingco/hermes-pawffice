name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `node bin/pawffice.js --hermes`
        2. Click ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Node 22.11, Hermes Agent v0.21.2, macOS 15"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [demo, hermes]
  - type: markdown
    attributes:
      value: "Please do not paste API keys or the contents of `.env`."
