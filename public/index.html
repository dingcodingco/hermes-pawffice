<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pawffice · Hermes 픽셀 사무실</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <strong id="title">Pawffice</strong>
      <span id="mode" class="badge">데모</span>
    </div>
    <nav class="tabs">
      <button data-panel="feed">보고함</button>
      <button data-panel="kanban">칸반</button>
      <button data-panel="skills">스킬·연결</button>
      <button id="meetingBtn">회의 열기</button>
    </nav>
  </header>
  <main class="layout">
    <section class="stage-wrap" id="stageWrap">
      <div class="pages" id="pages" hidden></div>
      <div class="stage" id="stage">
        <img class="bg" src="assets/office-day.webp" alt="" draggable="false" />
        <div id="furniture"></div>
        <div id="board" title="칸반 보기"></div>
        <div id="agents"></div>
        <div id="fronts"></div>
        <div class="meeting-sign" id="meetingSign" hidden></div>
      </div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
